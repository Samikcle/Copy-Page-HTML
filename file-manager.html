<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML File Manager</title>
  <style>
    body {
      max-width: 520px;
      margin: 60px auto;
      padding: 20px;
      font-family: system-ui, sans-serif;
      color: #1e293b;
    }

    h1 {
      font-size: 24px;
    }

    p {
      line-height: 1.6;
    }

    button {
      padding: 12px 18px;
      margin: 8px 8px 8px 0;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status.success {
      color: #16803c;
    }

    #status.error {
      color: #c62828;
    }
  </style>
</head>
<body>
  <h1>HTML File Manager</h1>

  <p id="selectedFile">Selected file: None</p>

  <p>
    Save As lets you select a new destination.
    Overwrite updates the currently selected file.
  </p>

  <button type="button" id="saveButton">
    Save HTML As
  </button>

  <button type="button" id="overwriteButton" disabled>
    Overwrite Selected File
  </button>

  <p id="status" role="status" aria-live="polite"></p>

  <script src="file-store.js"></script>
  <script src="file-manager.js"></script>
</body>
</html>
