<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copy Page HTML</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Copy Page HTML</h1>

  <label class="option">
    <input type="checkbox" id="captureDoctype" checked>
    Include DOCTYPE
  </label>

  <p class="hint">
    Applies to copying and saving HTML.
  </p>

  <button type="button" id="copyButton">
    Copy HTML
  </button>

  <!-- New: Save and Overwrite buttons -->
  <div class="file-actions">
    <button type="button" id="saveButton">
      Save HTML As
    </button>

    <button type="button" id="overwriteButton">
      Overwrite HTML File
    </button>
  </div>

  <!-- New: Show selected filename -->
  <p id="selectedFile">Selected file: None</p>

  <p id="status" role="status" aria-live="polite"></p>

  <script src="file-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
