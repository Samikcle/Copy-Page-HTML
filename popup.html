<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copy Page HTML</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Copy Page HTML</h1>

  <label class="option">
    <input type="checkbox" id="captureDoctype" checked>
    Include DOCTYPE
  </label>

  <p class="hint">
    Applies to both the button and keyboard shortcut.
  </p>

  <button type="button" id="copyButton">
    Copy HTML
  </button>

  <p id="status" role="status" aria-live="polite"></p>

  <script src="popup.js"></script>
</body>
</html>
